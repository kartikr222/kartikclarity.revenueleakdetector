<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Kartik Clarity cover banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1224" />
      <stop offset="100%" stop-color="#121835" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6E7C7" />
      <stop offset="100%" stop-color="#E8D5B5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity="0.24" />
    </filter>
  </defs>
  <rect width="1600" height="900" rx="72" fill="url(#bg)" />
  <g transform="translate(120 120)">
    <rect width="1360" height="660" rx="52" fill="#0B1224" opacity="0.85" />
    <rect x="20" y="20" width="1320" height="620" rx="42" fill="url(#bg)" filter="url(#shadow)" />
    <g transform="translate(80 90)">
      <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="72" fill="#FFFFFF">Revenue Leak</text>
      <text x="0" y="96" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="112" fill="url(#accent)">Diagnosis</text>
      <text x="0" y="190" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="32" fill="#D3D7E0">AI-powered insight to recover lost revenue and grow faster.</text>
      <rect x="0" y="260" width="420" height="72" rx="36" fill="url(#accent)" />
      <text x="30" y="312" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="28" fill="#0B1224">Book a strategy call</text>
    </g>
    <g transform="translate(980 220)">
      <rect x="0" y="0" width="520" height="340" rx="36" fill="#0F1724" opacity="0.65" />
      <circle cx="120" cy="140" r="70" fill="url(#accent)" opacity="0.95" />
      <path d="M76 122 L108 152 L146 98" stroke="#0B1224" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M20 250 C 120 180, 260 270, 360 210 C 520 120, 620 190, 680 190" stroke="url(#accent)" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.8" />
    </g>
  </g>
</svg>
