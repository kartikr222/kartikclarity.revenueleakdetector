<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Kartik Clarity cover banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0B1224" />
      <stop offset="1" stop-color="#171427" />
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#F6E7C7" />
      <stop offset="1" stop-color="#E8D5B5" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
  <g transform="translate(120,160)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="72" fill="#FFFFFF">Find Your Hidden</text>
    <text x="0" y="100" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="96" fill="url(#accent)">Revenue Leaks</text>
    <text x="0" y="170" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="24" fill="#AAB2C6">AI-powered diagnosis with clear, prioritized fixes and dollarized impact.</text>
  </g>
  <g transform="translate(900,200)">
    <path d="M0 240 C 80 120, 200 120, 280 200 C 360 280, 520 200, 640 160" stroke="url(#accent)" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
    <circle cx="280" cy="200" r="12" fill="url(#accent)" />
  </g>
</svg>